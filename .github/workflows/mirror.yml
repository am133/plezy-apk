name: Mirror Plezy APK
on:
  schedule:
    - cron: "0 */6 * * *"   # check every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCH: armeabi-v7a      # or arm64-v8a
    steps:
      - name: Get latest upstream tag
        id: up
        run: echo "tag=$(gh release view -R edde746/plezy --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      - name: Skip if already mirrored
        id: check
        run: |
          if gh release view "${{ steps.up.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download, extract, publish
        if: steps.check.outputs.exists != 'true'
        run: |
          TAG="${{ steps.up.outputs.tag }}"
          gh release download "$TAG" -R edde746/plezy -p "plezy-android-${ARCH}.tar.gz"
          tar -xzf "plezy-android-${ARCH}.tar.gz"
          mv plezy.apk "plezy-${TAG}-${ARCH}.apk"
          gh release create "$TAG" "plezy-${TAG}-${ARCH}.apk" \
            -R "$GITHUB_REPOSITORY" --title "Plezy $TAG" \
            --notes "Mirrored from https://github.com/edde746/plezy/releases/tag/$TAG"
